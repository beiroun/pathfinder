# Pathfinder next to another product on one host (shared edge)
# =============================================================
# Layered over docker-compose.yml when .env sets
#   COMPOSE_FILE=docker-compose.yml:docker-compose.shared-edge.yml
# so `docker compose`, pathfinder.service and push.sh all see the same set. Used where the host's ports 80/443
# already belong to another product's edge proxy (ThunderVox): Pathfinder runs no edge of its own, its site blocks
# go into that edge (shared-edge.caddy, rendered by cohost.sh), and its loopback ports move off the neighbour's.
#
#   database   127.0.0.1:5432 -> 5433
#   server     127.0.0.1:8080 -> 8090
#   console    127.0.0.1:8081 -> 8091 (its nginx proxies /api to 8090)

services:
  postgres:
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-c", "port=5433"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5433 -U pathfinder -d pathfinder"]

  server:
    environment:
      PF_DB_URL: "jdbc:postgresql://127.0.0.1:5433/pathfinder"
      PF_SERVER_PORT: "8090"

  console:
    volumes:
      # The image's nginx config listens on 8081 and proxies to 8080; this copy differs only in the two ports
      - type: bind
        source: ./console-shared-edge.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false

  edge:
    # Started only with COMPOSE_PROFILES=own-edge, i.e. never here: the neighbour's edge serves both names
    profiles: ["own-edge"]
