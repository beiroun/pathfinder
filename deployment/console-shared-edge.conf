#
# The console's nginx with a shared edge (docker-compose.shared-edge.yml): the image's own config moved to the
# ports that do not collide with the neighbour product - listens on 127.0.0.1:8091, the server is 127.0.0.1:8090.
# Everything else is the image's nginx/default.conf; keep the two in step.
server {
    listen 127.0.0.1:8091;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A management console is not a search result; the meta tag in index.html says the same for the SPA shell
    add_header X-Robots-Tag "noindex, nofollow" always;

    # The server owns everything under /api (its paths start with /api/v1); the URI is passed through unchanged
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Hashed build assets never change: cache them for good
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fonts are versioned by content too, but they carry a fixed name: a day of caching is the safe middle
    location /fonts/ {
        expires 1d;
        try_files $uri =404;
    }

    # Client-side routes resolve to the SPA entry point
    location / {
        try_files $uri $uri/ /index.html;
    }
}
