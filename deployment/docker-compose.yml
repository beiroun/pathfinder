# Pathfinder - the whole system on one host
# =========================================
# This directory holds the application compose, console.conf and .env (from .env.example).
# No component sources, no builds on the host - every service is a published image, pinned to the version it was
# tested with. Publish an image before updating its exact tag here. Upload and activation are separate operations.
#
# Secrets and host-specific routing never enter this repository.
#
# Every service runs with network_mode: host: one host, no bridge NAT, 127.0.0.1 means the same thing for all of
# them. Only HTTP(S) faces the internet, through the edge; the database, the server and the console's nginx
# listen on loopback.
#
# Firewall: TCP 80 + 443 (edge; 80 is required even for an HTTPS-only site - the ACME challenge and the redirect
# to HTTPS both use it).

# Pinned project name. Without it Compose takes the directory name ("deployment"), and the database volume is
# named after it: a checkout under another directory name would start Postgres on a new, empty volume.
name: pathfinder

services:
  postgres:
    # Every external image is pinned by exact tag and digest (rule of 2026-10-22): a floating tag pulls whatever it
    # means that day. A bump is a deliberate change of both, after checking that the tag resolves and the digest
    # downloads (RUNBOOK, "Pinned versions")
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    container_name: pathfinder-postgres
    network_mode: host
    # Host networking: the database is for the server on this host only, so bind to loopback
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-c", "port=${PF_DB_PORT:?set PF_DB_PORT in deployment/.env}"]
    environment:
      POSTGRES_DB: pathfinder
      POSTGRES_USER: pathfinder              # schema owner; the server runs Flyway as it
      POSTGRES_PASSWORD: "${PF_DB_PASSWORD:?set PF_DB_PASSWORD in deployment/.env}"
      TZ: "${PF_TZ:-UTC}"
    volumes:
      # postgres:18 keeps PGDATA at /var/lib/postgresql/18/docker; the parent is what the image declares as the volume
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${PF_DB_PORT:?set PF_DB_PORT in deployment/.env} -U pathfinder -d pathfinder"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: always

  server:
    image: ghcr.io/beiroun/pathfinder-server:0.2.0
    container_name: pathfinder-server
    network_mode: host
    environment:
      PF_DB_URL: "jdbc:postgresql://127.0.0.1:${PF_DB_PORT:?set PF_DB_PORT in deployment/.env}/pathfinder"
      PF_DB_USER: "pathfinder"
      PF_DB_PASSWORD: "${PF_DB_PASSWORD:?set PF_DB_PASSWORD in deployment/.env}"
      PF_SERVER_BIND: "127.0.0.1"            # reached by the console's nginx (/api) and by the edge proxy
      PF_SERVER_PORT: "${PF_SERVER_PORT:?set PF_SERVER_PORT in deployment/.env}"
      # Printed into every QR code: the server's public name. A printed code outlives any deployment.
      PF_PUBLIC_BASE_URL: "https://${PF_SERVER_HOST:?set PF_SERVER_HOST in deployment/.env}"
      # Browser origins allowed to call the API cross-site. The console is same-origin through its own nginx,
      # so this is only for a console served from another name. Empty = no cross-site browser access.
      PF_CORS_ORIGINS: "${PF_CORS_ORIGINS:-}"
      PF_LOG_LEVEL: "${PF_LOG_LEVEL:-INFO}"
      # Console access: token signing key and the users (an empty secret or admin list refuses to start)
      PF_JWT_SECRET: "${PF_JWT_SECRET:?set PF_JWT_SECRET in deployment/.env}"
      PF_ADMIN_USERS: "${PF_ADMIN_USERS:?set PF_ADMIN_USERS in deployment/.env}"
      PF_VIEWER_USERS: "${PF_VIEWER_USERS:-}"
      PF_ACCESS_TOKEN_TTL: "${PF_ACCESS_TOKEN_TTL:-PT15M}"
      PF_REFRESH_TOKEN_TTL: "${PF_REFRESH_TOKEN_TTL:-P7D}"
      TZ: "${PF_TZ:-UTC}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  console:
    image: ghcr.io/beiroun/pathfinder-console:0.4.2
    container_name: pathfinder-console
    network_mode: host                       # listeners and upstreams are set in site-local console.conf
    volumes:
      - type: bind
        source: ./console.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    environment:
      TZ: "${PF_TZ:-UTC}"
    depends_on:
      - server
    restart: always

volumes:
  postgres-data:
    external: true
    name: "${PF_DB_VOLUME:?set PF_DB_VOLUME to the existing database volume in deployment/.env}"
